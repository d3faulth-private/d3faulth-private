<svg xmlns="http://www.w3.org/2000/svg" width="900" height="12" viewBox="0 0 900 12" role="img" aria-label="Section divider">
<defs><linearGradient id="line"><stop stop-color="#7aa2f7" stop-opacity="0"/><stop offset=".25" stop-color="#7aa2f7"/><stop offset=".75" stop-color="#bb9af7"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></linearGradient><linearGradient id="shine"><stop stop-color="#c0caf5" stop-opacity="0"/><stop offset=".5" stop-color="#c0caf5"/><stop offset="1" stop-color="#c0caf5" stop-opacity="0"/></linearGradient><clipPath id="clip"><rect y="5" width="900" height="2"/></clipPath></defs>
<style>.shine{animation:scan 7s linear infinite}@keyframes scan{from{transform:translateX(-180px)}to{transform:translateX(1050px)}}@media(prefers-reduced-motion:reduce){.shine{animation:none;opacity:0}}</style>
<rect y="5" width="900" height="1" fill="url(#line)" opacity=".65"/><g clip-path="url(#clip)"><rect class="shine" y="5" width="180" height="2" fill="url(#shine)" opacity=".65"/></g></svg>